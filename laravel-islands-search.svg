<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient (Same as Archipelago) -->
    <linearGradient id="bg-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Lens Surface Gradient -->
    <linearGradient id="lens-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Core Accent Glow Gradient (Matching the Main Island Glow) -->
    <linearGradient id="search-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Pure Blur Filter (Isolated for background glow layers only) -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <!-- Base Card Frame (App Icon) -->
  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#bg-core)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Scan Rings (Companion to the topography lines) -->
  <g fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6" opacity="0.3">
    <circle cx="90" cy="90" r="62" />
    <circle cx="90" cy="90" r="78" />
  </g>

  <!-- Incoming Source Streams (Feeding the lens) -->
  <path d="M 22,52 C 38,52 44,62 56,68" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 178,48 C 160,48 150,58 128,66" fill="none" stroke="#FB7185" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 24,160 C 38,150 48,136 60,122" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- LENS STRUCTURE (FIXED LAYERING) -->

  <!-- Back Glow Layer (For Finder compatibility) -->
  <g filter="url(#soft-glow)" opacity="0.85">
    <circle cx="90" cy="90" r="40" fill="none" stroke="url(#search-glow)" stroke-width="7" />
    <line x1="120" y1="120" x2="152" y2="152" stroke="#FB7185" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Sharp Lens Layer (Foreground, no filter) -->
  <g>
    <!-- Handle -->
    <line x1="120" y1="120" x2="152" y2="152" stroke="#FB7185" stroke-width="11" stroke-linecap="round" />
    <line x1="124" y1="124" x2="150" y2="150" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <!-- Lens Glass -->
    <circle cx="90" cy="90" r="40" fill="url(#lens-surface)" stroke="url(#search-glow)" stroke-width="4" />
  </g>

  <!-- LENS CONTENT / GROUPED HITS (Placed above everything sharp) -->
  <!-- Group Heading -->
  <rect x="68" y="68" width="18" height="3" rx="1.5" fill="#94A3B8" opacity="0.5" />

  <!-- Hit 1 (Active, Highlight Blue) -->
  <rect x="62" y="78" width="56" height="12" rx="4" fill="#38BDF8" opacity="0.15" />
  <circle cx="69" cy="84" r="3" fill="#38BDF8" />
  <rect x="76" y="82" width="30" height="4" rx="2" fill="#38BDF8" opacity="0.9" />

  <!-- Hit 2 (Highlight Green) -->
  <circle cx="69" cy="98" r="3" fill="#34D399" />
  <rect x="76" y="96" width="24" height="4" rx="2" fill="#334155" />
  <rect x="103" y="96" width="10" height="4" rx="2" fill="#34D399" opacity="0.9" />

  <!-- Hit 3 (Highlight Pink/Red) -->
  <circle cx="69" cy="110" r="3" fill="#FB7185" />
  <rect x="76" y="108" width="20" height="4" rx="2" fill="#334155" />

  <!-- OUTER FLOATING SOURCE NODES (FIXED LAYERING) -->

  <!-- Blue Node (NW) -->
  <g>
    <circle cx="22" cy="52" r="4" fill="#38BDF8" />
    <circle cx="22" cy="52" r="7" fill="#38BDF8" filter="url(#soft-glow)" opacity="0.8" />
    <circle cx="22" cy="52" r="1.5" fill="#0F172A" />
  </g>

  <!-- Coral Node (NE) -->
  <g>
    <circle cx="178" cy="48" r="4" fill="#FB7185" />
    <circle cx="178" cy="48" r="7" fill="#FB7185" filter="url(#soft-glow)" opacity="0.8" />
    <circle cx="178" cy="48" r="1.5" fill="#0F172A" />
  </g>

  <!-- Green Node (SW) -->
  <g>
    <circle cx="24" cy="160" r="4" fill="#34D399" />
    <circle cx="24" cy="160" r="7" fill="#34D399" filter="url(#soft-glow)" opacity="0.8" />
    <circle cx="24" cy="160" r="1.5" fill="#0F172A" />
  </g>
</svg>
